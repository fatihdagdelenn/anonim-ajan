upstream PROJE_1_backend {
    server IP_PRIV_1:8080 max_fails=3;
    server HOST_1.DOMAIN_1:8080 backup;
}
server {
    listen 443 ssl http2;
    server_name PROJE_1.DOMAIN_1 HOST_2.PROJE_1.DOMAIN_1;
    ssl_certificate     /etc/letsencrypt/live/PROJE_1.DOMAIN_1/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PROJE_1.DOMAIN_1/privkey.pem;
    access_log /var/log/nginx/PROJE_1.access.log;
    location /api/ {
        proxy_pass http://PROJE_1_backend;
        proxy_set_header Authorization "Bearer TOKEN_1";
        allow IP_PUB_1/24;
        allow 10.0.0.0/8;
        deny all;
    }
}
